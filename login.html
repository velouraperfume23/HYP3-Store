<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
<title>HYP3 | Join Us</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="img/logo/hyp3-logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="brand"><img src="img/logo/hyp3-logo.png" alt="" style="width:36px;margin:0 auto 10px;display:block"></div>
  <h1 class="brand-logo">HYP3</h1>

  <div id="signup-form">
    <div class="input-group"><input type="text" placeholder="Full Name" id="sign-name"></div>
    <div class="input-group"><input type="email" placeholder="Email Address" id="sign-email"></div>
    <div class="input-group">
      <input type="password" placeholder="Create Password" id="sign-pass">
      <i class="fas fa-eye toggle-icon" onclick="togglePassword('sign-pass', this)"></i>
    </div>
    <button class="btn-auth" onclick="handleSignup()">Create Account</button>
    <p class="toggle-link">Already have an account? <span onclick="switchForm()">Login</span></p>
  </div>

  <div id="login-form" class="hidden">
    <div class="input-group"><input type="email" placeholder="Email Address" id="login-email"></div>
    <div class="input-group">
      <input type="password" placeholder="Password" id="login-pass">
      <i class="fas fa-eye toggle-icon" onclick="togglePassword('login-pass', this)"></i>
    </div>
    <button class="btn-auth" onclick="handleLogin()">Login</button>
    <p class="toggle-link">New to HYP3? <span onclick="switchForm()">Sign Up</span></p>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
